# Render Blueprint: deploys the TicketQ prototype as a web service.
# Every push to the main branch on GitHub triggers a new deploy.
services:
  - type: web
    name: ticketq
    runtime: python
    plan: free
    rootDir: prototype
    buildCommand: pip install -r requirements.txt
    # One process (the in-memory queue + worker live in it), several threads for requests.
    startCommand: gunicorn --workers 1 --threads 8 --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /api/events
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: DATABASE_URL
        sync: false   # secret: you enter the Supabase connection string in the Render dashboard
